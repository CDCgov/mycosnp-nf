name: pre_mycosnp_comb_summary
description: Combine individual sample line summaries into a single pre-mycosnp summary report
keywords:
  - summary
  - csv
  - combine
  - report
  - mycosnp
  - statistics
  - concatenate
tools:
  - coreutils:
      description: |
        The GNU Core Utilities are the basic file, shell and text manipulation utilities
        of the GNU operating system. This module uses echo and cat commands to combine
        CSV summary files.
      homepage: https://www.gnu.org/software/coreutils/
      documentation: https://www.gnu.org/software/coreutils/manual/
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:coreutils
input:
  - - line_summary:
        type: file
        description: |
          List of individual sample line summary CSV files containing pre-mycosnp statistics
          for each sample including predicted taxonomy, subtyping, GAMBIT results, read quality,
          assembly metrics, and coverage statistics.
        pattern: "*_linesummary.csv"
        ontologies: []
output:
  csv:
    - "pre-mycosnp-summary.csv":
        type: file
        description: |
          Combined CSV summary report containing all sample statistics in a single file
          with headers for Sample, Predicted_Rank, Predicted_Taxon, Subtype_Closest_Match,
          Subtype_ANI, Closest_GAMBIT_Entry_Description, Closest_GAMBIT_Entry_Distance,
          Trimmed_Reads, Avg_Read_Quality, Sample_Assembly_Length, Sample_Assembly_GC,
          Reference_Genome_Length, Avg_Depth_Coverage, and Reference_GC.
        pattern: "pre-mycosnp-summary.csv"
        ontologies: []
authors:
  - "AMD Platform"
maintainers:
  - "AMD Platform"