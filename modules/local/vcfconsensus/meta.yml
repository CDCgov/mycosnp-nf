name: vcfconsensus
description: Generate consensus sequences from VCF and reference FASTA
keywords:
  - vcf
  - consensus
  - variants
  - fasta
tools:
  - bcftools:
      description: BCFtools is a set of utilities that manipulate variant calls in VCF and BCF formats
      homepage: https://samtools.github.io/bcftools/
      documentation: https://samtools.github.io/bcftools/bcftools.html
      doi: 10.1093/gigascience/giab008
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
  - - vcf:
        type: file
        description: Multi-sample VCF file
        pattern: "*.{vcf,vcf.gz}"
  - - tbi:
        type: file
        description: VCF index file
        pattern: "*.tbi"
  - - fasta:
        type: file
        description: Reference genome FASTA file
        pattern: "*.{fasta,fa,fna}"
output:
  - fastas:
      - "*.fasta.gz":
          type: file
          description: Consensus FASTA sequences for each sample
          pattern: "*.fasta.gz"
  - txt:
      - "*.txt":
          type: file
          description: List of sample names
          pattern: "*.txt"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
