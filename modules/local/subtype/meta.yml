name: subtype
description: Determine organism subtype using sourmash signatures
keywords:
  - subtyping
  - genomics
  - sourmash
  - minhash
tools:
  - sourmash:
      description: Compute and compare MinHash signatures for DNA data sets
      homepage: https://sourmash.readthedocs.io/
      documentation: https://sourmash.readthedocs.io/en/latest/
      doi: 10.21105/joss.00027
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
  - - gambit_results:
        type: file
        description: GAMBIT identification results
        pattern: "*.csv"
  - - seq:
        type: file
        description: Sequence file for subtyping
        pattern: "*.{fasta,fa,fna}"
  - - subtype_db:
        type: file
        description: Sourmash signature database for subtyping
        pattern: "*.sig"
output:
  - subtype:
      - "*_subtype.csv":
          type: file
          description: Subtype determination results
          pattern: "*_subtype.csv"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@arunbodd"
  - "@djfeistel"
  - "@ghuelgasmorales"
  - "@rouzbahani"
  - "@Slucking"
  - "@tjaensch"
  - "@yyr4"
maintainers:
