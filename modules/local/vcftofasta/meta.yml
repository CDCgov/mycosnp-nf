name: vcftofasta
description: Convert VCF SNP positions to FASTA alignment
keywords:
  - vcf
  - fasta
  - alignment
  - snp
  - variants
tools:
  - scipy:
      description: Scientific computing tools for Python
      homepage: https://www.scipy.org/
      documentation: https://docs.scipy.org/doc/scipy/
      doi: 10.1038/s41592-019-0686-2
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
  - - vcf:
        type: file
        description: VCF file containing variants
        pattern: "*.{vcf,vcf.gz}"
  - - samplelist:
        type: file
        description: List of samples to include
        pattern: "*.txt"
  - - max_amb_samples:
        type: integer
        description: Maximum number of samples with ambiguous bases
  - - max_perc_amb_samples:
        type: integer
        description: Maximum percentage of samples with ambiguous bases
  - - min_depth:
        type: integer
        description: Minimum read depth for variant calling
  - - fasta:
        type: file
        description: Reference genome FASTA file
        pattern: "*.{fasta,fa,fna}"
output:
  - fasta:
      - "*.fasta":
          type: file
          description: Multiple sequence alignment in FASTA format
          pattern: "*.fasta"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
